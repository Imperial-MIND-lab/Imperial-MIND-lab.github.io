  <!-- Lightning Bolts with animation -->
  <!-- Top left bolt -->
  <g class="lightning-bolt lightning-1" filter="url(#glow)">
    <path d="M 60 30 L 50 50 L 57 50 L 45 75 L 65 50 L 58 50 Z"
          fill="url(#lightningGradient)"
          stroke="#FF8C00"
          stroke-width="1.2" />
  </g>

  <!-- Top center bolt -->
  <g class="lightning-bolt lightning-2" filter="url(#glow)">
    <path d="M 160 15 L 150 35 L 157 35 L 145 60 L 165 35 L 158 35 Z"
          fill="url(#lightningGradient)"
          stroke="#FF8C00"
          stroke-width="1.2" />
  </g>

  <!-- Top right bolt -->
  <g class="lightning-bolt lightning-3" filter="url(#glow)">
    <path d="M 260 30 L 250 50 L 257 50 L 245 75 L 265 50 L 258 50 Z"
          fill="url(#lightningGradient)"
          stroke="#FF8C00"
          stroke-width="1.2" />
  </g>

