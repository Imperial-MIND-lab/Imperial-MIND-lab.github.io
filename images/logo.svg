<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <!-- Gradient for lightning -->
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect for lightning -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lightning animation -->
    <style>
      @keyframes lightning-flash {
        0%, 100% { opacity: 1; transform: scale(1); }
        10% { opacity: 0.3; }
        20% { opacity: 1; }
        30% { opacity: 0.5; }
        40%, 90% { opacity: 1; }
      }

      .lightning-bolt {
        animation: lightning-flash 3s ease-in-out infinite;
        transform-origin: center;
      }

      .lightning-1 { animation-delay: 0s; }
      .lightning-2 { animation-delay: 0.3s; }
      .lightning-3 { animation-delay: 0.6s; }
      .lightning-4 { animation-delay: 0.9s; }
      .lightning-5 { animation-delay: 1.2s; }
    </style>
  </defs>

